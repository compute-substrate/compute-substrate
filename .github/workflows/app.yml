# Builds Doorway, the app (opens .csd sites from your own computer, with a node inside, for people who don't use a terminal)
# in public, from the tagged source, for macOS (one app for Apple Silicon and Intel) and Windows.
# Every step and its output is in this run's log; the release lists the SHA-256 of each file.
#
# A release: push a tag named app-v<version>, e.g. app-v0.1.0. A manual run (Actions, "Run
# workflow") builds the same files and keeps them as the run's artifacts, without a release.
name: app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release of Commonplace the app carries (app/commonplace.json): built from its pinned commit,
  # and used only if it comes out with exactly the pinned IPFS address
  commonplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned release
        id: pin
        run: |
          echo "repo=$(jq -r .repository app/commonplace.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit app/commonplace.json)" >> "$GITHUB_OUTPUT"
          echo "cid=$(jq -r .cid app/commonplace.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: commonplace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build it, and check it is the published release
        working-directory: commonplace
        run: |
          npm ci
          npm run release:ipfs | tee ../release.log
          got=$(grep -o 'bafy[a-z0-9]*' ../release.log | head -1)
          echo "built $got, pinned ${{ steps.pin.outputs.cid }}"
          test "$got" = "${{ steps.pin.outputs.cid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: commonplace-site
          path: commonplace/out
      # its .car too, so every copy of the app can share this release over IPFS
      - name: The release's .car
        run: cp commonplace/release/commonplace-*.car commonplace.car
      - uses: actions/upload-artifact@v4
        with:
          name: commonplace-car
          path: commonplace.car
      # when the build doesn't come out as the published release, its files, to see why
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commonplace-site-mismatch
          path: commonplace/out

  build:
    needs: commonplace
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Before building: does the certificate secret open with its password? Says which secret is
      # wrong, without showing either (only the file's size and the start of its hash, to compare
      # with the .p12 on your Mac: shasum -a 256 cert.p12)
      - name: Check the signing certificate (macOS)
        if: matrix.name == 'macos'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then echo "No certificate secret: the app is built unsigned."; exit 0; fi
          printf %s "$CERT" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/c.p12" 2>/dev/null || { echo "APPLE_CERTIFICATE isn't valid base64 text."; exit 1; }
          echo "Certificate: $(wc -c < "$RUNNER_TEMP/c.p12" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$RUNNER_TEMP/c.p12" | cut -c1-16)"
          echo "Password: ${#CERT_PASSWORD} characters"
          security create-keychain -p check "$RUNNER_TEMP/check.keychain"
          if security import "$RUNNER_TEMP/c.p12" -k "$RUNNER_TEMP/check.keychain" -P "$CERT_PASSWORD" >/dev/null 2>&1; then echo "The password opens the certificate."; ok=1; else echo "The password does NOT open this certificate."; ok=0; fi
          security delete-keychain "$RUNNER_TEMP/check.keychain"; rm -f "$RUNNER_TEMP/c.p12"
          [ "$ok" = 1 ]


      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      # The node, exactly as an operator builds it (`cargo build --release --locked`), once per CPU
      - name: Build the node (macOS, both CPUs)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --locked --bin csd --target aarch64-apple-darwin
          cargo build --release --locked --bin csd --target x86_64-apple-darwin
          mkdir -p app/src-tauri/binaries
          lipo -create -output app/src-tauri/binaries/csd-universal-apple-darwin \
            target/aarch64-apple-darwin/release/csd target/x86_64-apple-darwin/release/csd
          # the app looks for it under each CPU's name too while it builds
          cp app/src-tauri/binaries/csd-universal-apple-darwin app/src-tauri/binaries/csd-aarch64-apple-darwin
          cp app/src-tauri/binaries/csd-universal-apple-darwin app/src-tauri/binaries/csd-x86_64-apple-darwin

      - name: Build the node (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          cargo build --release --locked --bin csd --target x86_64-pc-windows-msvc
          mkdir -p app/src-tauri/binaries
          cp target/x86_64-pc-windows-msvc/release/csd.exe app/src-tauri/binaries/csd-x86_64-pc-windows-msvc.exe

      # the .csd name resolver the window uses (app/resolver), bundled into app/ui/resolver.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the name resolver
        working-directory: app/resolver
        run: npm ci --prefix ../../kit && npm ci && npm run build && npm test
      # the front page the app carries, opened on the first launch (home/)
      - name: Build the front page
        shell: bash
        run: (cd home && npm run build) && rm -rf app/src-tauri/home && cp -r home/out app/src-tauri/home

      - uses: actions/download-artifact@v4
        with:
          name: commonplace-site
          path: app/src-tauri/commonplace
      - uses: actions/download-artifact@v4
        with:
          name: commonplace-car
          path: app/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # the app says which version it is: the tag's (app-v0.2.11 is 0.2.11)
      - name: Version from the tag
        if: startsWith(github.ref_name, 'app-v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          node -e 'const f="app/src-tauri/tauri.conf.json",fs=require("fs"),j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")' "$v"
          grep '"version"' app/src-tauri/tauri.conf.json

      # Signed with a Developer ID and notarized by Apple when the repository has these secrets (then
      # macOS opens it without asking); without them it's built unsigned, as before.
      - name: Build the app (macOS)
        if: matrix.name == 'macos'
        working-directory: app/src-tauri
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            export APPLE_CERTIFICATE="$CERT" APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD" APPLE_SIGNING_IDENTITY="$IDENTITY"
            export APPLE_ID="$AID" APPLE_PASSWORD="$APW" APPLE_TEAM_ID="$TEAM"
          fi
          cargo tauri build --target universal-apple-darwin --bundles dmg

      - name: Build the app (Windows)
        if: matrix.name == 'windows'
        working-directory: app/src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect the files and their checksums
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.name }}" = macos ]; then
            cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Doorway-macOS.dmg"
            cp app/src-tauri/binaries/csd-universal-apple-darwin out/csd-macos
          else
            cp app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe "out/Doorway-Windows-setup.exe"
            cp app/src-tauri/binaries/csd-x86_64-pc-windows-msvc.exe out/csd-windows.exe
          fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS-${{ matrix.name }}.txt; else shasum -a 256 * > SHA256SUMS-${{ matrix.name }}.txt; fi
          cat SHA256SUMS-${{ matrix.name }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          # the node's own releases stay "latest" on the repo; the app's are found by their tag
          make_latest: false
          body: |
            Doorway: opens .csd sites from your own computer, checked byte for byte, with a node inside.

            Built by GitHub Actions from this tag's source; the run's log shows every step. `csd-macos` and `csd-windows.exe` are the node programs inside the apps, as built; their SHA-256 are in the SHA256SUMS files.

            The apps are not signed by Apple or Microsoft, so the first launch asks for a confirmation. See app/README.md.

  # A door's programs for Linux servers (scripts/door.sh installs them): the node and the site
  # store, built for x86-64 and ARM on the oldest supported Ubuntu, so they run on newer ones too
  door-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the node and the site store
        run: |
          cargo build --release --locked --bin csd
          (cd sites && cargo build --release --locked)
          mkdir -p out
          cp target/release/csd out/csd-linux-${{ matrix.arch }}
          cp sites/target/release/csd-sites out/csd-sites-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: door-${{ matrix.arch }}
          path: out/*

  door-release:
    needs: door-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: door-*
          merge-multiple: true
          path: out
      # the directory and the front page, packed: publish each with Doorway (Publish, then choose the .car)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the directory
        run: |
          (cd kit && npm ci) && (cd app/resolver && npm ci) && (cd directory && npm run build) && (cd home && npm run build) && (cd chess && npm ci && npm test && npm run build)
          npx --yes ipfs-car@3.1.0 pack directory/out --output out/directory.car
          npx --yes ipfs-car@3.1.0 pack home/out --output out/home.car
          npx --yes ipfs-car@3.1.0 pack chess/out --output out/chess.car
      - name: The installer, for this release, and the checksums
        run: |
          sed "s/__TAG__/${GITHUB_REF_NAME}/" scripts/door.sh > out/door.sh
          cd out && sha256sum csd-linux-* csd-sites-linux-* > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: door-linux
          path: out/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          make_latest: false
