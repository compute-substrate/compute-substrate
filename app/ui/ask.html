<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doorway</title>
<!-- A site asking to write with Doorway's key: shown small and on top; the answer goes back to
     Doorway's main window, which does the signing. -->
<style>
  :root {
    --bg: #fbf7f0; --card: #ffffff; --ink: #2a2420; --muted: #8a8078; --line: #efe7db; --accent: #2e6b5a;
    --display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1714; --card: #24201c; --ink: #f2ece4; --muted: #a59a8e; --line: #332d27; --accent: #7fcbb0; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  main { height: 100%; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0; font: 700 16px/1.3 var(--display); }
  .what { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; max-height: 96px; overflow: auto; }
  .bal { margin: 0; color: var(--muted); font-size: 12.5px; }
  label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: auto; }
  button { border: 0; border-radius: 999px; padding: 9px 18px; font: 600 14px var(--display); cursor: pointer; }
  #yes { background: var(--accent); color: #fff; }
  #no { background: var(--line); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">A site asks to write</h1>
  <p class="what" id="what"></p>
  <p class="bal" id="bal"></p>
  <label id="alwaysRow"><input type="checkbox" id="always"> <span id="alwaysText"></span></label>
  <div class="btns"><button id="no">Decline</button><button id="yes">Allow</button></div>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const $ = id => document.getElementById(id);
  let current = null;
  function show(a) {
    if (!a) return;
    current = a;
    $("title").textContent = a.title;
    $("what").textContent = a.what;
    $("bal").textContent = a.balance || "";
    $("alwaysRow").hidden = !a.always;
    $("alwaysText").textContent = a.always || "";
    $("always").checked = false;
    $("yes").disabled = $("no").disabled = false;
    $("yes").focus();
  }
  const reply = allow => {
    if (!current) return;
    $("yes").disabled = $("no").disabled = true;
    invoke("ask_reply", { reply: { id: current.id, allow, always: allow && $("always").checked } });
    current = null;
  };
  $("yes").onclick = () => reply(true);
  $("no").onclick = () => reply(false);
  addEventListener("keydown", e => { if (e.key === "Escape") reply(false); });
  listen("ask-show", e => show(e.payload));
  invoke("ask_current").then(show);
</script>
</body>
</html>
