<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compute Substrate Explorer</title>

<link rel="stylesheet" href="/explorer.css">

</head>
<body>
<main>
  <h1>Compute Substrate Explorer</h1>
  <p class="small" style="font-size:18px; margin-bottom:22px;">Proposal view.</p>

  <p class="nav">
    <a href="/">Overview</a>
    <a href="/blocks.html">Blocks</a>
    <a href="/proposals.html">Proposals</a>
    <a href="/attestations.html">Attestations</a>
    <a href="/domains.html">Domains</a>
    <a href="/search.html">Search</a>
    <a href="http://explorer.computesubstrate.org">Explorer</a>
    <a href="http://computesubstrate.org">Main site</a>
  </p>

 

  <div class="box">
    <label for="proposalId" class="small muted">Proposal id (32-byte hex, with or without 0x)</label>
    <input id="proposalId" type="text" placeholder="0x..." autocomplete="off" spellcheck="false">
    <button id="loadBtn">Load proposal</button>
  </div>

  <div id="status" class="loading">Waiting for proposal id…</div>

  <div id="proposal-section" style="display:none;">
    <h2>Proposal</h2>
    <div id="proposal-kv" class="kv"></div>
  </div>

  <div class="small muted" style="margin-top: 30px;">
    Static explorer. No cookies. No authority.
  </div>
</main>

<script src="/node.js"></script>
<script>
  const API = "";

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function normalizeHex(s) {
    return (s || "").trim().replace(/^0x/i, "").toLowerCase();
  }

  function isHex32(s) {
    return /^[0-9a-f]{64}$/i.test(s);
  }

  async function getJSON(path) {
    const r = await csdFetch(path, { headers: { "accept": "application/json" } });
    if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
    return r.json();
  }

function displayUri(uri, n = 72) {
  try {
    const u = new URL(uri);
    const clean = (u.hostname + u.pathname).replace(/\/$/, "");
    return clean.length > n ? clean.slice(0, n) + "…" : clean;
  } catch (_) {
    const s = String(uri || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }
}

function titleFromUri(uri) {
  try {
    const u = new URL(uri);
    const last = u.pathname.split("/").filter(Boolean).pop() || u.hostname;
    return last
      .replaceAll("-", " ")
      .replaceAll("_", " ")
      .replace(/\b\w/g, c => c.toUpperCase());
  } catch (_) {
    return String(uri || "").slice(0, 120);
  }
}

async function fetchContextMaybe(uri) {
  try {
    const r = await fetch(uri, { method: "GET" });
    if (!r.ok) return { title: null, summary: null };

    const ct = r.headers.get("content-type") || "";
    if (!ct.includes("text/html") && !ct.includes("text/plain")) {
      return { title: null, summary: null };
    }

    const text = await r.text();

    const title =
      text.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)?.[1]
      || text.match(/<meta[^>]+name=["']twitter:title["'][^>]+content=["']([^"']+)["']/i)?.[1]
      || text.match(/<title[^>]*>([^<]+)<\/title>/i)?.[1];

    const summary =
      text.match(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)["']/i)?.[1]
      || text.match(/<meta[^>]+name=["']twitter:description["'][^>]+content=["']([^"']+)["']/i)?.[1]
      || text.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)["']/i)?.[1]
      || text.match(/<p[^>]*>(.*?)<\/p>/is)?.[1];

    return {
      title: title ? cleanText(title).slice(0, 180) : null,
      summary: summary ? cleanText(summary).slice(0, 600) : null
    };
  } catch (_) {
    return { title: null, summary: null };
  }
}

function cleanText(s) {
  return String(s || "")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&")
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\s+/g, " ")
    .trim();
}

  function setStatus(msg, isError = false) {
    const el = document.getElementById("status");
    el.className = isError ? "error" : "loading";
    el.textContent = msg;
    el.style.display = "";
  }


async function renderProposal(data) {
  const p = data.proposal || {};
  const el = document.getElementById("proposal-kv");

const isUrl = /^https?:\/\//i.test(String(p.uri || "").trim());
const fallbackTitle = isUrl ? titleFromUri(p.uri) : "Plain text proposal";
const shortUri = isUrl ? displayUri(p.uri) : String(p.uri || "").slice(0, 140);

  el.innerHTML = `
    <div class="box" style="margin-bottom:22px;">
      <div class="small muted">Context derived from URI</div>
      <h2 style="margin-top:6px;" id="context-title">${esc(fallbackTitle)}</h2>
      <p id="context-summary" class="muted" style="font-size:17px; margin-bottom:12px;"></p>
<div class="small">
  ${
    isUrl
      ? `<a href="${esc(p.uri)}" title="${esc(p.uri)}" target="_blank" rel="noopener noreferrer">${esc(shortUri)}</a>`
      : `<span class="mono">${esc(shortUri)}</span>`
  }
</div>
    </div>

    <div><b>Proposal ID:</b> <span class="mono">${esc(p.proposal_id)}</span></div>
    <div><b>Domain:</b> <a href="/proposals.html?domain=${encodeURIComponent(p.domain)}">${esc(p.domain)}</a></div>
    <div><b>Payload hash:</b> <span class="mono">${esc(p.payload_hash)}</span></div>
    <div><b>URI:</b> <a href="${esc(p.uri)}" title="${esc(p.uri)}" target="_blank" rel="noopener noreferrer">${esc(shortUri)}</a></div>
    <div><b>Created height:</b> ${esc(p.created_height)}</div>
    <div><b>Created epoch:</b> ${esc(p.created_epoch)}</div>
    <div><b>Fee:</b> ${esc(p.fee)}</div>
    <div><b>Proposer:</b> <span class="mono">${esc(p.proposer)}</span></div>
    <div><b>Expires epoch:</b> ${esc(p.expires_epoch)}</div>
    <div class="small muted" style="margin-top:10px;">
      Proposal inclusion records a speculative computational object only. It does not imply correctness, endorsement, or authority.
    </div>
  `;

  document.getElementById("proposal-section").style.display = "";
  document.getElementById("status").style.display = "none";

const ctx = isUrl
  ? await fetchContextMaybe(p.uri)
  : { title: "Plain text proposal", summary: String(p.uri || "") };

  if (ctx.title) {
    document.getElementById("context-title").textContent = ctx.title;
  }

  if (ctx.summary) {
    document.getElementById("context-summary").textContent = ctx.summary;
  } else {
    document.getElementById("context-summary").textContent =
      "No summary available from the linked URI.";
  }
}

  async function loadProposal() {
    const raw = document.getElementById("proposalId").value;
    const hex = normalizeHex(raw);

    document.getElementById("proposal-section").style.display = "none";

    if (!hex) {
      setStatus("Enter a proposal id.");
      return;
    }

    if (!isHex32(hex)) {
      setStatus("Proposal id must be 32-byte hex.", true);
      return;
    }

    setStatus("Loading proposal…");

    try {
      const data = await getJSON(`/proposal/0x${hex}`);

      if (!data.ok) {
        setStatus(`Proposal not found: ${data.err || "unknown error"}`, true);
        return;
      }

     await renderProposal(data);
    } catch (err) {
      setStatus(`Error loading proposal: ${err.message || err}`, true);
    }
  }

  document.getElementById("loadBtn").addEventListener("click", loadProposal);
  document.getElementById("proposalId").addEventListener("keydown", (e) => {
    if (e.key === "Enter") loadProposal();
  });

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (id) {
    document.getElementById("proposalId").value = id;
    loadProposal();
  }
</script>
</body>
</html>
